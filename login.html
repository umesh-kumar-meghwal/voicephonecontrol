<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Voice Phone Control</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family:
                Inter,
                system-ui,
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(34,197,94,.15),
                    transparent 35%
                ),
                #050807;

        }

        .login-box {

            width: min(400px, 92%);

            padding: 32px;

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.06),
                    rgba(255,255,255,.02)
                );

            box-shadow:
                0 25px 70px
                rgba(0,0,0,.45);

        }

        .logo {

            text-align: center;

            font-size: 42px;

            margin-bottom: 10px;

        }

        h1 {

            margin: 0;

            text-align: center;

            font-size: 27px;

        }

        .subtitle {

            text-align: center;

            color: #91a29d;

            font-size: 13px;

            margin:
                8px
                0
                28px;

        }

        label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            color: #b9c7c2;

        }

        input {

            width: 100%;

            padding: 13px 14px;

            margin-bottom: 18px;

            border:
                1px solid
                rgba(255,255,255,.09);

            border-radius: 11px;

            outline: none;

            background: #0d1715;

            color: white;

            font-size: 14px;

        }

        input:focus {

            border-color:
                rgba(34,197,94,.55);

        }

        button {

            width: 100%;

            padding: 13px;

            border: 0;

            border-radius: 11px;

            background: #22c55e;

            color: #031008;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

        }

        button:hover {

            background: #16a34a;

            color: white;

        }

        button:disabled {

            opacity: .6;

            cursor: wait;

        }

        #message {

            min-height: 20px;

            margin-top: 16px;

            text-align: center;

            font-size: 13px;

        }

        .error {
            color: #fca5a5;
        }

        .success {
            color: #86efac;
        }

    </style>

</head>

<body>

<div class="login-box">

    <div class="logo">
        📱
    </div>

    <h1>
        Voice Phone Control
    </h1>

    <div class="subtitle">
        Sign in to access your dashboard
    </div>

    <form id="loginForm">

        <label>
            Username
        </label>

        <input
            id="username"
            type="text"
            autocomplete="username"
            placeholder="Enter username"
            required
        >

        <label>
            Password
        </label>

        <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter password"
            required
        >

        <button
            id="loginButton"
            type="submit"
        >
            Login
        </button>

    </form>

    <div id="message"></div>

</div>

<script>

const API_URL = "";

const form =
    document.getElementById(
        "loginForm"
    );

const button =
    document.getElementById(
        "loginButton"
    );

const message =
    document.getElementById(
        "message"
    );


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const username =
            document
                .getElementById("username")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;

        message.className = "";

        message.textContent =
            "⏳ Logging in...";

        button.disabled = true;

        try {

            const response =
                await fetch(
                    `${API_URL}/api/login`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials: "include",

                        body:
                            JSON.stringify({
                                username,
                                password
                            })
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "Login failed"
                );

            }

            message.className =
                "success";

            message.textContent =
                "✅ Login successful";

            setTimeout(
                function() {

                    window.location.href =
                        "/web/index.html";

                },
                500
            );

        } catch(error) {

            message.className =
                "error";

            message.textContent =
                "❌ " +
                error.message;

            button.disabled = false;

        }

    }
);

</script>

</body>

</html>
