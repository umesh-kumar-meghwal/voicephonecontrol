<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VoicePhoneControl</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #07100d;
            color: white;
        }

        .container {
            width: 92%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .card {
            background: #101b18;
            border: 1px solid #263832;
            border-radius: 18px;
            padding: 24px;
            margin-bottom: 20px;
        }

        h1,
        h2,
        h3 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 7px 0;
            border-radius: 10px;
            border: 1px solid #34453e;
            background: #09120f;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #22c55e;
        }

        button {
            padding: 11px 17px;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin: 4px;
            background: #22c55e;
            color: #041008;
        }

        button:hover {
            background: #16a34a;
            color: white;
        }

        button.danger {
            background: #ef4444;
            color: white;
        }

        button.secondary {
            background: #263832;
            color: white;
        }

        .hidden {
            display: none;
        }

        .message {
            margin-top: 12px;
            min-height: 20px;
        }

        .device {
            padding: 18px;
            border: 1px solid #34453e;
            border-radius: 14px;
            margin-top: 14px;
            background: #0b1512;
        }

        .online {
            color: #4dff88;
        }

        .offline {
            color: #ff6464;
        }

        .commands {
            display: flex;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .command {
            background: #1c2c26;
            color: white;
        }

        .command:hover {
            background: #22c55e;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .api-status {
            padding: 8px 12px;
            border-radius: 20px;
            background: #10251a;
            color: #4dff88;
            font-size: 13px;
        }

        .api-status.error {
            color: #ff6464;
            background: #2a1212;
        }

        .empty {
            padding: 20px;
            color: #9ca3af;
        }

        code {
            color: #86efac;
        }

    </style>

</head>

<body>

<div class="container">

    <!-- AUTH -->

    <div id="authBox"
         class="card">

        <h1>
            📱 VoicePhoneControl
        </h1>

        <p>
            Login or create your account.
        </p>

        <input
            id="username"
            type="text"
            placeholder="Username"
            autocomplete="username"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button
            onclick="registerUser()"
        >
            Register
        </button>

        <button
            onclick="loginUser()"
        >
            Login
        </button>

        <p
            id="authMessage"
            class="message"
        ></p>

    </div>


    <!-- DASHBOARD -->

    <div
        id="dashboardBox"
        class="hidden"
    >

        <div class="card">

            <div class="topbar">

                <div>

                    <h1>
                        📱 VoicePhoneControl
                    </h1>

                    <p>
                        Welcome,
                        <strong id="usernameDisplay">
                            User
                        </strong>
                    </p>

                </div>

                <div>

                    <span
                        id="apiStatus"
                        class="api-status"
                    >
                        ● API
                    </span>

                    <button
                        class="danger"
                        onclick="logout()"
                    >
                        Logout
                    </button>

                </div>

            </div>

        </div>


        <!-- ADD DEVICE -->

        <div class="card">

            <h2>
                ➕ Add Device
            </h2>

            <p>
                Android app me jo Device ID mile,
                wo yahan enter karo.
            </p>

            <input
                id="deviceIdInput"
                placeholder="VPC-XXXXXXXX"
            >

            <button
                onclick="claimDevice()"
            >
                Add Device
            </button>

            <p
                id="deviceMessage"
                class="message"
            ></p>

        </div>


        <!-- DEVICES -->

        <div class="card">

            <div class="topbar">

                <h2>
                    📱 My Devices
                </h2>

                <button
                    class="secondary"
                    onclick="loadDevices()"
                >
                    🔄 Refresh
                </button>

            </div>

            <div id="devices">
                Loading...
            </div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   API CONFIG
===================================================== */

const API_URL =
    "https://voicephonecontrol.vercel.app/";


/* =====================================================
   TOKEN
===================================================== */

let token =
    localStorage.getItem(
        "vpc_token"
    );


/* =====================================================
   DOM
===================================================== */

const authBox =
    document.getElementById(
        "authBox"
    );

const dashboardBox =
    document.getElementById(
        "dashboardBox"
    );

const authMessage =
    document.getElementById(
        "authMessage"
    );

const deviceMessage =
    document.getElementById(
        "deviceMessage"
    );

const devicesContainer =
    document.getElementById(
        "devices"
    );

const apiStatus =
    document.getElementById(
        "apiStatus"
    );


/* =====================================================
   AUTH HEADERS
===================================================== */

function authHeaders() {

    return {

        "Content-Type":
            "application/json",

        "Authorization":
            "Bearer " + token

    };

}


/* =====================================================
   API REQUEST HELPER
===================================================== */

async function apiRequest(
    endpoint,
    options = {}
) {

    const response =
        await fetch(
            API_URL + endpoint,
            options
        );

    let data = {};

    try {

        data =
            await response.json();

    } catch {

        data = {};

    }

    if (!response.ok) {

        throw new Error(
            data.detail ||
            data.message ||
            `HTTP ${response.status}`
        );

    }

    return data;

}


/* =====================================================
   REGISTER
===================================================== */

async function registerUser() {

    const username =
        document
            .getElementById("username")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value;


    if (!username || !password) {

        authMessage.textContent =
            "Username and password required.";

        return;

    }


    if (username.length < 3) {

        authMessage.textContent =
            "Username minimum 3 characters.";

        return;

    }


    if (password.length < 6) {

        authMessage.textContent =
            "Password minimum 6 characters.";

        return;

    }


    authMessage.textContent =
        "⏳ Creating account...";


    try {

        const data =
            await apiRequest(
                "/auth/register",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            username:
                                username,

                            password:
                                password
                        })

                }
            );


        token =
            data.token;


        localStorage.setItem(
            "vpc_token",
            token
        );


        authMessage.textContent =
            "✅ Registration successful";


        showDashboard();


    } catch (error) {

        authMessage.textContent =
            "❌ " + error.message;

    }

}


/* =====================================================
   LOGIN
===================================================== */

async function loginUser() {

    const username =
        document
            .getElementById("username")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value;


    if (!username || !password) {

        authMessage.textContent =
            "Username and password required.";

        return;

    }


    authMessage.textContent =
        "⏳ Logging in...";


    try {

        const data =
            await apiRequest(
                "/auth/login",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            username:
                                username,

                            password:
                                password
                        })

                }
            );


        token =
            data.token;


        localStorage.setItem(
            "vpc_token",
            token
        );


        authMessage.textContent =
            "✅ Login successful";


        showDashboard();


    } catch (error) {

        authMessage.textContent =
            "❌ " + error.message;

    }

}


/* =====================================================
   CHECK CURRENT USER
===================================================== */

async function loadMe() {

    try {

        const data =
            await apiRequest(
                "/auth/me",
                {

                    method: "GET",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }

                }
            );


        document
            .getElementById(
                "usernameDisplay"
            )
            .textContent =
                data.user.username;


        setApiStatus(
            true
        );


    } catch (error) {

        console.error(
            "Auth error:",
            error
        );


        logout();

    }

}


/* =====================================================
   SHOW DASHBOARD
===================================================== */

function showDashboard() {

    authBox
        .classList
        .add("hidden");


    dashboardBox
        .classList
        .remove("hidden");


    loadMe();

    loadDevices();

}


/* =====================================================
   SHOW LOGIN
===================================================== */

function showAuth() {

    authBox
        .classList
        .remove("hidden");


    dashboardBox
        .classList
        .add("hidden");

}


/* =====================================================
   CLAIM DEVICE
===================================================== */

async function claimDevice() {

    const deviceId =
        document
            .getElementById(
                "deviceIdInput"
            )
            .value
            .trim()
            .toUpperCase();


    if (!deviceId) {

        deviceMessage.textContent =
            "Device ID required.";

        return;

    }


    deviceMessage.textContent =
        "⏳ Adding device...";


    try {

        const data =
            await apiRequest(
                "/devices/claim",
                {

                    method: "POST",

                    headers:
                        authHeaders(),

                    body:
                        JSON.stringify({
                            device_id:
                                deviceId
                        })

                }
            );


        deviceMessage.textContent =
            "✅ " +
            (
                data.message ||
                "Device added successfully."
            );


        document
            .getElementById(
                "deviceIdInput"
            )
            .value = "";


        loadDevices();


    } catch (error) {

        deviceMessage.textContent =
            "❌ " + error.message;

    }

}


/* =====================================================
   LOAD DEVICES
===================================================== */

async function loadDevices() {

    devicesContainer.innerHTML =
        "⏳ Loading devices...";


    try {

        const data =
            await apiRequest(
                "/devices",
                {

                    method: "GET",

                    headers:
                        authHeaders()

                }
            );


        setApiStatus(
            true
        );


        if (
            !data.devices ||
            data.devices.length === 0
        ) {

            devicesContainer.innerHTML =
                `
                <div class="empty">
                    📱 No devices added yet.
                </div>
                `;

            return;

        }


        devicesContainer.innerHTML =
            "";


        data.devices.forEach(
            function(device) {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "device";


                const status =
                    device.online

                        ? `
                            <span class="online">
                                ● Online
                            </span>
                          `

                        : `
                            <span class="offline">
                                ● Offline
                            </span>
                          `;


                div.innerHTML = `

                    <h3>
                        📱
                        ${escapeHtml(
                            device.device_name ||
                            "Android Phone"
                        )}
                    </h3>

                    <p>
                        Device ID:
                        <strong>
                            ${escapeHtml(
                                device.device_id
                            )}
                        </strong>
                    </p>

                    <p>
                        Model:
                        ${escapeHtml(
                            device.device_model ||
                            "Unknown"
                        )}
                    </p>

                    <p>
                        Status:
                        ${status}
                    </p>

                    <div class="commands">

                        <button
                            class="command"
                            onclick="sendCommand(
                                '${escapeJs(
                                    device.device_id
                                )}',
                                'HOME'
                            )"
                        >
                            🏠 HOME
                        </button>


                        <button
                            class="command"
                            onclick="sendCommand(
                                '${escapeJs(
                                    device.device_id
                                )}',
                                'BACK'
                            )"
                        >
                            ↩️ BACK
                        </button>


                        <button
                            class="command"
                            onclick="sendCommand(
                                '${escapeJs(
                                    device.device_id
                                )}',
                                'VOLUME_UP'
                            )"
                        >
                            🔊 VOL +
                        </button>


                        <button
                            class="command"
                            onclick="sendCommand(
                                '${escapeJs(
                                    device.device_id
                                )}',
                                'VOLUME_DOWN'
                            )"
                        >
                            🔉 VOL -
                        </button>


                        <button
                            class="command"
                            onclick="sendCommand(
                                '${escapeJs(
                                    device.device_id
                                )}',
                                'TAKE_SCREENSHOT'
                            )"
                        >
                            📸 SCREENSHOT
                        </button>


                        <button
                            class="command"
                            onclick="sendCommand(
                                '${escapeJs(
                                    device.device_id
                                )}',
                                'PHONE_STATUS'
                            )"
                        >
                            📊 PHONE STATUS
                        </button>

                    </div>

                `;


                devicesContainer.appendChild(
                    div
                );

            }
        );


    } catch (error) {

        console.error(
            error
        );


        if (
            error.message
                .toLowerCase()
                .includes("token")
        ) {

            logout();

            return;

        }


        setApiStatus(
            false
        );


        devicesContainer.innerHTML =
            `
            <div class="empty">
                ❌ ${escapeHtml(
                    error.message
                )}
            </div>
            `;

    }

}


/* =====================================================
   SEND COMMAND
===================================================== */

async function sendCommand(
    deviceId,
    command
) {

    try {

        const data =
            await apiRequest(
                "/command",
                {

                    method: "POST",

                    headers:
                        authHeaders(),

                    body:
                        JSON.stringify({

                            device_id:
                                deviceId,

                            command:
                                command,

                            payload: {}

                        })

                }
            );


        alert(
            "✅ " +
            command +
            " queued for " +
            deviceId
        );


        return data;


    } catch (error) {

        alert(
            "❌ " +
            error.message
        );


        return null;

    }

}


/* =====================================================
   LOGOUT
===================================================== */

function logout() {

    localStorage.removeItem(
        "vpc_token"
    );


    token = null;


    showAuth();

}


/* =====================================================
   API STATUS
===================================================== */

function setApiStatus(
    online
) {

    if (online) {

        apiStatus.textContent =
            "● API Connected";

        apiStatus.classList
            .remove("error");

    } else {

        apiStatus.textContent =
            "● API Error";

        apiStatus.classList
            .add("error");

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================================
   ESCAPE JS
===================================================== */

function escapeJs(
    value
) {

    return String(
        value ?? ""
    )
        .replaceAll(
            "\\",
            "\\\\"
        )
        .replaceAll(
            "'",
            "\\'"
        );

}


/* =====================================================
   INITIALIZE
===================================================== */

async function initialize() {

    if (!token) {

        showAuth();

        return;

    }


    try {

        await loadMe();

        showDashboard();

    } catch {

        logout();

    }

}


/* =====================================================
   START
===================================================== */

initialize();

</script>

</body>

</html>
