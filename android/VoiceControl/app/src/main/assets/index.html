<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Voice Phone Control</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                sans-serif;

            background: #f4f6f8;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;

            background: white;

            border-radius: 18px;

            padding: 28px;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin-top: 0;

            text-align: center;
        }

        .subtitle {
            text-align: center;

            color: #666;

            margin-bottom: 28px;
        }

        .device-box {
            background: #f1f3f5;

            border-radius: 12px;

            padding: 18px;

            margin-bottom: 20px;
        }

        .label {
            font-size: 13px;

            color: #666;

            margin-bottom: 8px;
        }

        .device-id {
            font-size: 20px;

            font-weight: bold;

            word-break: break-all;
        }

        button {
            width: 100%;

            border: none;

            border-radius: 10px;

            padding: 14px;

            font-size: 16px;

            cursor: pointer;

            background: #111827;

            color: white;
        }

        button:active {
            transform: scale(0.98);
        }

        .status {
            text-align: center;

            margin-top: 16px;

            color: #666;

            font-size: 14px;
        }

    </style>
</head>

<body>

<div class="card">

    <h1>
        Voice Phone Control
    </h1>

    <p class="subtitle">
        Android Device
    </p>

    <div class="device-box">

        <div class="label">
            DEVICE ID
        </div>

        <div
                id="deviceId"
                class="device-id"
        >
            Registering...
        </div>

    </div>

    <button
            onclick="copyDeviceId()"
    >
        Copy Device ID
    </button>

    <div
            id="status"
            class="status"
    >
        Connecting...
    </div>

</div>


<script>

    // =====================================================
    // DEVICE ID FROM ANDROID
    // =====================================================

    function loadDeviceId() {

        try {

            if (
                typeof Android !== "undefined" &&
                Android.getDeviceId
            ) {

                const id =
                    Android.getDeviceId();

                if (id && id.trim() !== "") {

                    setDeviceId(id);

                } else {

                    document.getElementById(
                        "deviceId"
                    ).innerText =
                        "Not registered";

                    document.getElementById(
                        "status"
                    ).innerText =
                        "Device registration pending";
                }

            } else {

                document.getElementById(
                    "deviceId"
                ).innerText =
                    "Android bridge unavailable";

                document.getElementById(
                    "status"
                ).innerText =
                    "Open this page inside the Android app";
            }

        } catch (error) {

            console.error(error);

            document.getElementById(
                "deviceId"
            ).innerText =
                "Unable to load Device ID";
        }
    }


    // =====================================================
    // CALLED FROM KOTLIN
    // =====================================================

    function setDeviceId(id) {

        const element =
            document.getElementById(
                "deviceId"
            );

        const status =
            document.getElementById(
                "status"
            );

        element.innerText =
            id || "Not available";

        if (id) {

            status.innerText =
                "Device registered successfully";

        } else {

            status.innerText =
                "Device registration failed";
        }
    }


    // =====================================================
    // COPY
    // =====================================================

    async function copyDeviceId() {

        const id =
            document.getElementById(
                "deviceId"
            ).innerText;

        if (
            !id ||
            id === "Registering..." ||
            id === "Not registered"
        ) {

            return;
        }

        try {

            await navigator.clipboard.writeText(id);

            document.getElementById(
                "status"
            ).innerText =
                "Device ID copied";

        } catch (error) {

            console.error(error);

            document.getElementById(
                "status"
            ).innerText =
                "Copy failed";
        }
    }


    // =====================================================
    // PAGE LOAD
    // =====================================================

    window.onload = function () {

        loadDeviceId();

    };

</script>

</body>
</html>
